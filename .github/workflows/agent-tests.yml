name: Agent detail regression tests

on:
  push:
    branches:
      - fix/gdt-detail-timeout-rate-limit-20261014
  pull_request:
    paths:
      - 'agent/local_agent.py'
      - 'agent/tests/**'
      - '.github/workflows/agent-tests.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.8', '3.11']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install aiohttp 'curl_cffi>=0.7'
      - name: Syntax check
        run: python -m py_compile agent/local_agent.py agent/tests/test_detail_retry.py
      - name: Offline detail unit tests
        run: python -m unittest discover -s agent/tests -p 'test_*.py' -v
